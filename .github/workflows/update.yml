name: Update IPTV Playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/merge.py"
      - "scripts/scrape_channels.js"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape fresh channel URLs
        run: node scripts/scrape_channels.js
        continue-on-error: true   # never block the whole run if scraping fails

      - name: Merge playlists
        run: python scripts/merge.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save our freshly generated playlist somewhere outside git's
          # tracked working tree, so the reset below can't touch it.
          NEWFILE=$(mktemp)
          cp playlist.m3u "$NEWFILE"

          # Fully sync to the true latest main. This is critical: if we
          # only "soft reset", any OTHER file that changed upstream since
          # our checkout (e.g. you editing scripts on GitHub while this
          # run was in progress) would look like part of our commit --
          # which once accidentally included .github/workflows/update.yml
          # and got the whole push rejected (GITHUB_TOKEN is never
          # allowed to modify workflow files). A hard reset guarantees
          # every file except playlist.m3u exactly matches origin/main.
          git fetch origin main
          git reset --hard origin/main

          # Now reapply only our regenerated playlist on top of that
          # clean, up-to-date state.
          cp "$NEWFILE" playlist.m3u
          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update combined playlist"
            git push origin HEAD:main
          fi
