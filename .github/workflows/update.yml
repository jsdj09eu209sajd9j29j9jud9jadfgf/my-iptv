name: Update IPTV Playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/merge.py"
      - "scripts/scrape_channels.js"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape fresh channel URLs
        run: node scripts/scrape_channels.js
        continue-on-error: true   # never block the whole run if scraping fails

      - name: Merge playlists
        run: python scripts/merge.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # playlist.m3u is fully regenerated from scratch every run --
            # it has no meaningful line-by-line history, so a real
            # merge/rebase against a newer remote version is pointless
            # and prone to unresolvable conflicts (this file changes
            # almost entirely every run). Instead: sync to the latest
            # remote state and rebuild our commit directly on top of it,
            # so our freshly generated file always wins outright.
            git fetch origin main
            git reset --soft origin/main
            git add playlist.m3u
            git commit -m "Update combined playlist"
            git push origin HEAD:main
          fi